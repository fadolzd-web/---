name: Build RELEASE - FINAL SIGNED
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www - KEEP ALL FILES
        run: |
          rm -rf android
          mkdir -p www
          for f in *; do
            if [ "$f" = "android" ] || [ "$f" = ".github" ] || [ "$f" = "node_modules" ] || [ "$f" = "www" ] || [ "$f" = ".git" ]; then continue; fi
            cp -r "$f" www/ 2>/dev/null || true
          done
          ls -lh www/quran.html
          du -sh www/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - name: Install
        run: |
          npm install || true
          npm install @capacitor/local-notifications @capacitor/geolocation || true
          pip install Pillow -q

      - name: Add android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Permissions + App Name
        run: |
          python3 << 'PY'
          import re
          mf="android/app/src/main/AndroidManifest.xml"
          c=open(mf,"r",encoding="utf-8").read()
          c = re.sub(r'<uses-permission[^>]*ACCESS_FINE_LOCATION[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*ACCESS_COARSE_LOCATION[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*ACCESS_BACKGROUND_LOCATION[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*POST_NOTIFICATIONS[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*SCHEDULE_EXACT_ALARM[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*USE_EXACT_ALARM[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*RECEIVE_BOOT_COMPLETED[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*WAKE_LOCK[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*VIBRATE[^>]*/?>\n?', '', c)
          c = re.sub(r'<uses-permission[^>]*FOREGROUND_SERVICE[^>]*/?>\n?', '', c)
          perms='''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
          '''
          if 'ACCESS_FINE_LOCATION' not in c:
              c=c.replace('<application', perms + '\n    <application')
          c=c.replace('android:label="@string/app_name"','android:label="التقويم الشامل"')
          open(mf,"w",encoding="utf-8").write(c)
          print("manifest patched")
          PY

      - name: Icon Fix
        run: |
          python3 << 'PY'
          from PIL import Image
          import os, shutil
          icon_path="icon.png" if os.path.exists("icon.png") else "www/icon.png" if os.path.exists("www/icon.png") else None
          if not icon_path: exit(0)
          im=Image.open(icon_path).convert("RGBA")
          os.makedirs("android/app/src/main/res/values", exist_ok=True)
          open("android/app/src/main/res/values/colors.xml","w").write('<resources><color name="ic_launcher_background">#0a1f14</color></resources>')
          v26="android/app/src/main/res/mipmap-anydpi-v26"
          if os.path.exists(v26): shutil.rmtree(v26)
          os.makedirs(v26, exist_ok=True)
          xml='<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'
          open(f"{v26}/ic_launcher.xml","w").write(xml)
          open(f"{v26}/ic_launcher_round.xml","w").write(xml)
          sizes={"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              p=f"android/app/src/main/res/{folder}"
              os.makedirs(p,exist_ok=True)
              im.resize((size,size), Image.LANCZOS).save(f"{p}/ic_launcher.png","PNG")
              im.resize((size,size), Image.LANCZOS).save(f"{p}/ic_launcher_round.png","PNG")
              fg=Image.new("RGBA",(int(size*1.5),int(size*1.5)),(0,0,0,0))
              inn=im.resize((int(int(size*1.5)*0.65),int(int(size*1.5)*0.65)), Image.LANCZOS)
              fg.paste(inn, ((fg.size[0]-inn.size[0])//2,(fg.size[1]-inn.size[1])//2), inn)
              fg.save(f"{p}/ic_launcher_foreground.png","PNG")
          PY

      - name: MainActivity
        run: |
          cat > android/app/src/main/java/com/fadol/taqweem/MainActivity.java <<'JAVA'
          package com.fadol.taqweem;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          public class MainActivity extends BridgeActivity implements SensorEventListener {
              private static final int LOC_PERM_CODE = 1001;
              private SensorManager sensorManager;
              private Sensor accSensor, magSensor;
              private float[] gravity, geomagnetic;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)!= PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, LOC_PERM_CODE);
                  }
                  WebView w = (WebView) this.bridge.getWebView();
                  w.getSettings().setGeolocationEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebChromeClient(new WebChromeClient(){ @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback){ callback.invoke(origin, true, true); } });
                  sensorManager = (SensorManager) getSystemService(SENSOR_SERVICE);
                  accSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  magSensor = sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);
              }
              @Override public void onResume() { super.onResume(); if(sensorManager!= null){ sensorManager.registerListener(this, accSensor, SensorManager.SENSOR_DELAY_GAME); sensorManager.registerListener(this, magSensor, SensorManager.SENSOR_DELAY_GAME); } }
              @Override public void onPause() { super.onPause(); if(sensorManager!= null) sensorManager.unregisterListener(this); }
              @Override public void onSensorChanged(SensorEvent event) {
                  if (event.sensor.getType() == Sensor.TYPE_ACCELEROMETER) gravity = event.values.clone();
                  if (event.sensor.getType() == Sensor.TYPE_MAGNETIC_FIELD) geomagnetic = event.values.clone();
                  if (gravity!= null && geomagnetic!= null) {
                      float[] R = new float[9]; float[] I = new float[9];
                      if (SensorManager.getRotationMatrix(R, I, gravity, geomagnetic)) {
                          float[] orientation = new float[3];
                          SensorManager.getOrientation(R, orientation);
                          float az = (float) Math.toDegrees(orientation[0]); az = (az + 360) % 360;
                          WebView w = (WebView) this.bridge.getWebView();
                          if(w!= null) w.evaluateJavascript("if(window.onNativeAzimuth) window.onNativeAzimuth("+az+")", null);
                      }
                  }
              }
              @Override public void onAccuracyChanged(Sensor sensor, int accuracy) {}
          }
          JAVA

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "Keystore decoded from secrets"
          else
            echo "No secret - generating new keystore"
            keytool -genkey -v -keystore android/app/release.keystore -alias taqweem -keyalg RSA -keysize 2048 -validity 10000 -storepass taqweem123 -keypass taqweem123 -dname "CN=Taqweem, OU=Taqweem, O=Taqweem, L=Tripoli, S=North, C=LB"
          fi
          ls -lh android/app/release.keystore

      - name: Build SIGNED RELEASE
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -z "$STORE_PASS" ]; then STORE_PASS=taqweem123; fi
          if [ -z "$ALIAS" ]; then ALIAS=taqweem; fi
          if [ -z "$KEY_PASS" ]; then KEY_PASS=taqweem123; fi
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=$STORE_PASS -Pandroid.injected.signing.key.alias=$ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS
          ls -lh app/build/outputs/apk/release/

      - name: Upload SIGNED APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-EMBEDDED-QURAN-APK
          path: android/app/build/outputs/apk/release/*.apk}
              @Override public void onAccuracyChanged(Sensor sensor, int accuracy) {}
          }
          JAVA

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          else
            echo "Generating keystore - WARNING: will break updates!"
            keytool -genkey -v -keystore android/app/release.keystore -alias taqweem -keyalg RSA -keysize 2048 -validity 10000 -storepass taqweem123 -keypass taqweem123 -dname "CN=Taqweem, OU=Taqweem, O=Taqweem, L=Tripoli, S=North, C=LB"
            echo "KEYSTORE_PASSWORD=taqweem123" >> $GITHUB_ENV
            echo "KEY_ALIAS=taqweem" >> $GITHUB_ENV
            echo "KEY_PASSWORD=taqweem123" >> $GITHUB_ENV
          fi

      - name: Build SIGNED RELEASE
        run: |
          cd android
          chmod +x gradlew
          STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          if [ -z "$STORE_PASS" ]; then STORE_PASS=${{ env.KEYSTORE_PASSWORD }}; fi
          if [ -z "$STORE_PASS" ]; then STORE_PASS=taqweem123; fi
          ALIAS=${{ secrets.KEY_ALIAS }}
          if [ -z "$ALIAS" ]; then ALIAS=${{ env.KEY_ALIAS }}; fi
          if [ -z "$ALIAS" ]; then ALIAS=taqweem; fi
          KEY_PASS=${{ secrets.KEY_PASSWORD }}
          if [ -z "$KEY_PASS" ]; then KEY_PASS=${{ env.KEY_PASSWORD }}; fi
          if [ -z "$KEY_PASS" ]; then KEY_PASS=taqweem123; fi
         ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=$STORE_PASS -Pandroid.injected.signing.key.alias=$ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS
          ls -lh app/build/outputs/apk/release/

      - name: Upload SIGNED APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-EMBEDDED-QURAN-APK
          path: android/app/build/outputs/apk/release/*.apk}
              @Override public void onAccuracyChanged(Sensor sensor, int accuracy) {}
          }
          JAVA

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          else
            echo "Generating keystore - WARNING: will break updates!"
            keytool -genkey -v -keystore android/app/release.keystore -alias taqweem -keyalg RSA -keysize 2048 -validity 10000 -storepass taqweem123 -keypass taqweem123 -dname "CN=Taqweem, OU=Taqweem, O=Taqweem, L=Tripoli, S=North, C=LB"
            echo "KEYSTORE_PASSWORD=taqweem123" >> $GITHUB_ENV
            echo "KEY_ALIAS=taqweem" >> $GITHUB_ENV
            echo "KEY_PASSWORD=taqweem123" >> $GITHUB_ENV
          fi

      - name: Build SIGNED RELEASE
        run: |
          cd android
          chmod +x gradlew
          STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          if [ -z "$STORE_PASS" ]; then STORE_PASS=${{ env.KEYSTORE_PASSWORD }}; fi
          if [ -z "$STORE_PASS" ]; then STORE_PASS=taqweem123; fi
          ALIAS=${{ secrets.KEY_ALIAS }}
          if [ -z "$ALIAS" ]; then ALIAS=${{ env.KEY_ALIAS }}; fi
          if [ -z "$ALIAS" ]; then ALIAS=taqweem; fi
          KEY_PASS=${{ secrets.KEY_PASSWORD }}
          if [ -z "$KEY_PASS" ]; then KEY_PASS=${{ env.KEY_PASSWORD }}; fi
          if [ -z "$KEY_PASS" ]; then KEY_PASS=taqweem123; fi
         ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=$STORE_PASS -Pandroid.injected.signing.key.alias=$ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS
          ls -lh app/build/outputs/apk/release/

      - name: Upload SIGNED APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-EMBEDDED-QURAN-APK
          path: android/app/build/outputs/apk/release/*.apk                  w.getSettings().setGeolocationEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setAllowFileAccess(true);
                  w.getSettings().setDatabaseEnabled(true);
                  w.getSettings().setMixedContentMode(android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  sensorManager = (SensorManager) getSystemService(SENSOR_SERVICE);
                  accSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  magSensor = sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);

                  w.setWebChromeClient(new WebChromeClient(){
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback){
                          callback.invoke(origin, true, true);
                      }
                  });
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if(sensorManager != null){
                      sensorManager.registerListener(this, accSensor, SensorManager.SENSOR_DELAY_GAME);
                      sensorManager.registerListener(this, magSensor, SensorManager.SENSOR_DELAY_GAME);
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if(sensorManager != null) sensorManager.unregisterListener(this);
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  if (event.sensor.getType() == Sensor.TYPE_ACCELEROMETER) gravity = event.values.clone();
                  if (event.sensor.getType() == Sensor.TYPE_MAGNETIC_FIELD) geomagnetic = event.values.clone();
                  if (gravity != null && geomagnetic != null) {
                      float[] R = new float[9];
                      float[] I = new float[9];
                      boolean success = SensorManager.getRotationMatrix(R, I, gravity, geomagnetic);
                      if (success) {
                          float[] orientation = new float[3];
                          SensorManager.getOrientation(R, orientation);
                          float az = (float) Math.toDegrees(orientation[0]);
                          az = (az + 360) % 360;
                          WebView w = (WebView) this.bridge.getWebView();
                          if(w != null) w.evaluateJavascript("if(window.onNativeAzimuth) window.onNativeAzimuth("+az+")", null);
                      }
                  }
              }
              @Override public void onAccuracyChanged(Sensor sensor, int accuracy) {}

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOC_PERM_CODE && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      WebView w = (WebView) this.bridge.getWebView();
                      if (w != null) w.reload();
                  }
              }
          }
          JAVA
      - name: Generate or Decode keystore - SIGNED APK FIX
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using secrets keystore"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          else
            echo "No secrets - generating keystore to fix 'package invalid'"
            keytool -genkey -v -keystore android/app/release.keystore -alias taqweem -keyalg RSA -keysize 2048 -validity 10000 -storepass taqweem123 -keypass taqweem123 -dname "CN=Taqweem, OU=Taqweem, O=Taqweem, L=Tripoli, S=North, C=LB"
            echo "KEYSTORE_PASSWORD=taqweem123" >> $GITHUB_ENV
            echo "KEY_ALIAS=taqweem" >> $GITHUB_ENV
            echo "KEY_PASSWORD=taqweem123" >> $GITHUB_ENV
          fi
          ls -lh android/app/release.keystore
      - name: Build SIGNED RELEASE
        run: |
          cd android
          chmod +x gradlew
          STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          if [ -z "$STORE_PASS" ]; then STORE_PASS=${{ env.KEYSTORE_PASSWORD }}; fi
          if [ -z "$STORE_PASS" ]; then STORE_PASS=taqweem123; fi
          ALIAS=${{ secrets.KEY_ALIAS }}
          if [ -z "$ALIAS" ]; then ALIAS=${{ env.KEY_ALIAS }}; fi
          if [ -z "$ALIAS" ]; then ALIAS=taqweem; fi
          KEY_PASS=${{ secrets.KEY_PASSWORD }}
          if [ -z "$KEY_PASS" ]; then KEY_PASS=${{ env.KEY_PASSWORD }}; fi
          if [ -z "$KEY_PASS" ]; then KEY_PASS=taqweem123; fi
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=$STORE_PASS -Pandroid.injected.signing.key.alias=$ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS
          ls -lh app/build/outputs/apk/release/
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.keystore -Pandroid.injected.signing.store.password=$STORE_PASS -Pandroid.injected.signing.key.alias=$ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS || true
          ls -lh app/build/outputs/bundle/release/ || true
      - name: Upload SIGNED APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-SIGNED-APK
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
