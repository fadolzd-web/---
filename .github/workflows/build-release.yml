name: Build RELEASE - Signed for Play Store
on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create www
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png || echo "no icon"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install

      - name: Init Cap
        run: npx cap init "التقويم الشامل" com.fadol.taqweem --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Copy
        run: npx cap copy android

      - name: FIX ICONS - Resize properly
        run: |
          python3 << 'PY'
          from PIL import Image
          import os
          src="icon.png"
          if not os.path.exists(src):
              print("no icon.png")
              exit(0)
          sizes={
            "mipmap-mdpi":48,
            "mipmap-hdpi":72,
            "mipmap-xhdpi":96,
            "mipmap-xxhdpi":144,
            "mipmap-xxxhdpi":192,
          }
          im=Image.open(src).convert("RGBA")
          for folder, size in sizes.items():
              path=f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              resized=im.resize((size,size), Image.LANCZOS)
              # save optimized
              resized.save(os.path.join(path,"ic_launcher.png"), "PNG", optimize=True)
              resized.save(os.path.join(path,"ic_launcher_round.png"), "PNG", optimize=True)
              # remove foreground that causes AAPT error
              fg=os.path.join(path,"ic_launcher_foreground.png")
              if os.path.exists(fg):
                  os.remove(fg)
              print(f"{folder} -> {size}x{size} OK")
          print("Icons fixed")
          PY

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          GRADLE

      - name: Build RELEASE APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-RELEASE-APK-signed
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-RELEASE-AAB-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
