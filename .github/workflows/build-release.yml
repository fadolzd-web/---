name: Build RELEASE - FINAL BG + GPS + Compass
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare www - KEEP ALL FILES
        run: |
          rm -rf android
          mkdir -p www
          for f in *; do
            if [ "$f" = "android" ] || [ "$f" = ".github" ] || [ "$f" = "node_modules" ] || [ "$f" = "www" ] || [ "$f" = ".git" ]; then continue; fi
            cp -r "$f" www/ 2>/dev/null || true
          done
          ls -la www/ | head -30
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install
        run: |
          npm install || true
          npm install @capacitor/local-notifications @capacitor/geolocation || true
          pip install Pillow -q
      - name: Add android
        run: |
          npx cap add android
          npx cap sync android
      - name: Permissions + App Name in Settings
        run: |
          python3 << 'PY'
          import os
          mf="android/app/src/main/AndroidManifest.xml"
          c=open(mf,"r",encoding="utf-8").read()
          # remove old perms to avoid dup
          lines=[]
          for l in c.splitlines():
              if any(x in l for x in ["ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","ACCESS_BACKGROUND_LOCATION","POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","USE_EXACT_ALARM","RECEIVE_BOOT_COMPLETED","WAKE_LOCK","VIBRATE","FOREGROUND_SERVICE"]):
                  continue
              lines.append(l)
          c="\n".join(lines)
          perms='''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
          '''
          # force app label = التقويم الشامل so it shows in permission screen
          c=c.replace('android:label="@string/app_name"','android:label="التقويم الشامل"')
          if 'android:label="التقويم الشامل"' not in c:
              c=c.replace('<application', '<application android:label="التقويم الشامل"')
          c=c.replace("<application",perms+"\n    <application")
          open(mf,"w",encoding="utf-8").write(c)
          print("manifest patched with compass + app name")

          # strings.xml
          sp="android/app/src/main/res/values/strings.xml"
          if os.path.exists(sp):
              s=open(sp,"r",encoding="utf-8").read()
              s=s.replace(">App<",">التقويم الشامل<").replace(">app<",">التقويم الشامل<")
              if "التقويم الشامل" not in s:
                  s=s.replace("<string name=\"app_name\">","<string name=\"app_name\">التقويم الشامل</string><string name=\"old\">")
              open(sp,"w",encoding="utf-8").write(s)
          # ensure beep.wav in raw for notification sound
          os.makedirs("android/app/src/main/res/raw", exist_ok=True)
          if os.path.exists("beep.wav"):
              import shutil; shutil.copy("beep.wav","android/app/src/main/res/raw/beep.wav")
          elif os.path.exists("www/beep.wav"):
              import shutil; shutil.copy("www/beep.wav","android/app/src/main/res/raw/beep.wav")
          PY
      - name: Icon fix + Splash - FINAL (removes adaptive xml)
        run: |
          python3 << 'PY'
          from PIL import Image
          import os, glob, shutil
          icon_path=None
          for p in ["icon.png","www/icon.png"]:
              if os.path.exists(p):
                  icon_path=p
                  break
          if not icon_path:
              print("NO icon.png found!")
              exit(0)
          im=Image.open(icon_path).convert("RGBA")
          print(f"Using icon {icon_path} size {im.size}")
          # 1. Remove adaptive icon xmls that override PNG - but recreate as proper adaptive that uses our PNG
          # Delete v26 folder entirely to force fallback to PNG, then recreate adaptive xml pointing to our PNG
          v26_path="android/app/src/main/res/mipmap-anydpi-v26"
          if os.path.exists(v26_path):
              shutil.rmtree(v26_path)
              print(f"Removed {v26_path}")
          os.makedirs(v26_path, exist_ok=True)
          # Create adaptive icon xml that uses ic_launcher_foreground.png and background color
          adaptive_xml='''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''
          open(f"{v26_path}/ic_launcher.xml","w").write(adaptive_xml)
          open(f"{v26_path}/ic_launcher_round.xml","w").write(adaptive_xml)
          print("Created adaptive xml pointing to foreground")
          # Ensure ic_launcher_background color exists
          os.makedirs("android/app/src/main/res/values", exist_ok=True)
          # Add color if not exists
          colors_path="android/app/src/main/res/values/colors.xml"
          # Ensure colors.xml is valid
          if not os.path.exists(colors_path):
              open(colors_path,"w").write('<resources><color name="ic_launcher_background">#0a1f14</color></resources>')
          else:
              try:
                  txt=open(colors_path,"r",encoding="utf-8").read()
                  if "ic_launcher_background" not in txt:
                      if "</resources>" in txt:
                          txt=txt.replace("</resources>",'    <color name="ic_launcher_background">#0a1f14</color>\n</resources>')
                      else:
                          txt+='\n<color name="ic_launcher_background">#0a1f14</color>\n</resources>'
                      open(colors_path,"w",encoding="utf-8").write(txt)
              except Exception as e:
                  print(f"colors.xml fix failed: {e}")
                  open(colors_path,"w").write('<resources><color name="ic_launcher_background">#0a1f14</color></resources>')
          # 2. Create launcher icons in all mipmap folders
          sizes={"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              p=f"android/app/src/main/res/{folder}"
              os.makedirs(p,exist_ok=True)
              im.resize((size,size), Image.LANCZOS).save(f"{p}/ic_launcher.png","PNG")
              im.resize((size,size), Image.LANCZOS).save(f"{p}/ic_launcher_round.png","PNG")
              fg_size=int(size*1.5)
              fg=Image.new("RGBA",(fg_size,fg_size),(0,0,0,0))
              inner=int(fg_size*0.65)
              inner_im=im.resize((inner,inner), Image.LANCZOS)
              fg.paste(inner_im, ((fg_size-inner)//2,(fg_size-inner)//2), inner_im)
              fg.save(f"{p}/ic_launcher_foreground.png","PNG")
              print(f"Icons created in {folder}")
          # 3. Splash
          bg_color=(10,31,20)
          splash_w, splash_h = 1080, 1920
          splash=Image.new("RGB", (splash_w, splash_h), bg_color)
          icon_size=500
          icon_resized=im.resize((icon_size,icon_size), Image.LANCZOS)
          x=(splash_w-icon_size)//2
          y=(splash_h-icon_size)//2 - 100
          splash_rgba=splash.convert("RGBA")
          splash_rgba.paste(icon_resized, (x,y), icon_resized)
          splash=splash_rgba.convert("RGB")
          for d in ["drawable", "drawable-port", "drawable-land"]:
              p=f"android/app/src/main/res/{d}"
              os.makedirs(p,exist_ok=True)
              splash.save(f"{p}/splash.png","PNG")
              print(f"Splash {d}/splash.png")
          if not os.path.exists("www/icon.png"):
              try: shutil.copy(icon_path,"www/icon.png")
              except: pass
          PY
      - name: MainActivity - FIX GPS permission + Compass
        run: |
          cat > android/app/src/main/java/com/fadol/taqweem/MainActivity.java <<'JAVA'
          package com.fadol.taqweem;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import android.hardware.Sensor;
          import android.hardware.SensorManager;
          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = (WebView) this.bridge.getWebView();
                  w.getSettings().setGeolocationEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setAllowFileAccess(true);
                  w.getSettings().setDatabaseEnabled(true);
                  SensorManager sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                  if(sm != null) sm.getDefaultSensor(Sensor.TYPE_ORIENTATION);
                  w.setWebChromeClient(new WebChromeClient(){
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback){
                          // FIX: true,true = allow and remember, not false
                          callback.invoke(origin, true, true);
                      }
                      @Override
                      public void onGeolocationPermissionsHidePrompt(){
                          super.onGeolocationPermissionsHidePrompt();
                      }
                  });
              }
          }
          JAVA
      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          fi
      - name: Build RELEASE APK + AAB
        run: |
          cd android
          chmod +x gradlew
          # Always build APK first (this is the release)
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease --info || ./gradlew assembleRelease
          else
            echo "Building unsigned APK"
            ./gradlew assembleRelease --info || ./gradlew assembleRelease
          fi
          echo "=== APK BUILT ==="
          ls -lh app/build/outputs/apk/release/ || true
          # Now try AAB (may fail if no signing, but try)
          if [ -f app/release.keystore ]; then
            ./gradlew bundleRelease --info || ./gradlew bundleRelease || true
          else
            ./gradlew bundleRelease --info || ./gradlew bundleRelease || true
          fi
          echo "=== AAB BUILT ==="
          ls -lh app/build/outputs/bundle/release/ || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-RELEASE-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-RELEASE-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
