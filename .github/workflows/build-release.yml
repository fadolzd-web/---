name: Build RELEASE - BG Notifications + GPS
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean
        run: |
          rm -rf android www
          mkdir -p www
          cp index.html www/index.html
          cp -f icon.png www/icon.png || true
          cp -f beep.wav www/beep.wav || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install
        run: |
          npm install
          npm install @capacitor/local-notifications @capacitor/geolocation || true
      - name: Add android
        run: |
          npx cap add android
          npx cap sync android
      - name: FORCE PERMISSIONS - BG
        run: |
          python3 << 'PY'
          path="android/app/src/main/AndroidManifest.xml"
          with open(path,"r",encoding="utf-8") as f:
              c=f.read()
          # clean
          for p in ["POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","USE_EXACT_ALARM","RECEIVE_BOOT_COMPLETED","WAKE_LOCK","VIBRATE","ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","ACCESS_BACKGROUND_LOCATION","FOREGROUND_SERVICE"]:
              # keep INTERNET
              if p!="INTERNET":
                  c="\n".join([l for l in c.splitlines() if p not in l])
          perms='''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          '''
          c=c.replace("<application",perms+"\n    <application")
          open(path,"w",encoding="utf-8").write(c)
          print(c)
          PY
      - name: FORCE MainActivity BG
        run: |
          cat > android/app/src/main/java/com/fadol/taqweem/MainActivity.java <<'JAVA'
          package com.fadol.taqweem;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = (WebView) this.bridge.getWebView();
                  w.getSettings().setGeolocationEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebChromeClient(new WebChromeClient(){
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback){
                          callback.invoke(origin, true, false);
                      }
                  });
              }
          }
          JAVA
      - name: Icons
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$d
            cp -f icon.png android/app/src/main/res/$d/ic_launcher.png || true
            cp -f icon.png android/app/src/main/res/$d/ic_launcher_round.png || true
          done
      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          fi
      - name: Build RELEASE
        run: |
          cd android
          chmod +x gradlew
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file=app/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          else
            ./gradlew assembleRelease
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-RELEASE-BG-NOTIFICATIONS
          path: android/app/build/outputs/apk/release/*.apk
