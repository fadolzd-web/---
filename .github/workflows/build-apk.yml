name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install
      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png || true
      - name: Init and Add Android
        run: |
          npx cap init Taqweem com.fadol.taqweem --web-dir=www || true
          npx cap add android || true
          npx cap copy android
      - name: Set Icons
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$d
            cp icon.png android/app/src/main/res/$d/ic_launcher.png
            cp icon.png android/app/src/main/res/$d/ic_launcher_round.png
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
