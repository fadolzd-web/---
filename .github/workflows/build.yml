name: Build APK - FINAL FIX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean old android - CRITICAL
        run: |
          rm -rf android
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: android-actions/setup-android@v3
      
      - name: Install deps
        run: npm install

      - name: Build fresh android
        run: |
          npx cap add android
          npx cap sync android

      - name: FORCE ALL PERMISSIONS INTO MANIFEST
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "--- BEFORE ---"
          cat $MANIFEST
          
          # Remove any old permissions to avoid duplicates then add fresh before <application
          sed -i '/ACCESS_FINE_LOCATION/d' $MANIFEST
          sed -i '/ACCESS_COARSE_LOCATION/d' $MANIFEST
          sed -i '/POST_NOTIFICATIONS/d' $MANIFEST
          sed -i '/INTERNET/d' $MANIFEST
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-feature android:name="android.hardware.location.gps" android:required="false" />
    <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />' $MANIFEST
          
          echo "--- AFTER ---"
          cat $MANIFEST
          grep -E "LOCATION|INTERNET|POST_NOTIFICATIONS" $MANIFEST

      - name: FORCE MainActivity - 100% working
        run: |
          mkdir -p android/app/src/main/java/com/fadol/taqweem
          cat > android/app/src/main/java/com/fadol/taqweem/MainActivity.java <<'JAVA'
          package com.fadol.taqweem;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = (WebView) this.bridge.getWebView();
                  w.getSettings().setGeolocationEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebChromeClient(new WebChromeClient(){
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback){
                          callback.invoke(origin, true, false);
                      }
                  });
              }
          }
          JAVA
          cat android/app/src/main/java/com/fadol/taqweem/MainActivity.java

      - name: Force Icons
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$d
            cp -f icon.png android/app/src/main/res/$d/ic_launcher.png
            cp -f icon.png android/app/src/main/res/$d/ic_launcher_round.png
          done

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-FIXED-location-qibla
          path: android/app/build/outputs/apk/debug/app-debug.apk
